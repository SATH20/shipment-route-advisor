# Render blueprint: the FastAPI backend as a free Python web service.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: shipment-route-advisor-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python generate_dataset.py && python -m evaluation.evaluate
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Your Vercel URL, e.g. https://shipment-route-advisor.vercel.app (comma-separate several).
      # Render asks for the value when the blueprint is created.
      - key: ALLOWED_ORIGINS
        sync: false
